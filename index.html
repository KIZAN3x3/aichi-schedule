<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>愛知活動スケジュール帳</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="boot-loading" class="boot-loading">
  <div class="boot-loading-spinner"></div>
</div>

<section id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <h1 class="app-title">愛知活動スケジュール帳</h1>
    <form id="login-form" class="login-form">
      <label for="password-input">パスワード</label>
      <input type="password" id="password-input" inputmode="numeric" autocomplete="off" required />
      <button type="submit" class="btn btn-primary">入る</button>
      <p id="login-error" class="form-error"></p>
    </form>
  </div>
</section>

<div id="app" class="app hidden">
  <header class="app-header">
    <h1 class="app-title">愛知活動スケジュール帳</h1>
    <div class="status-bar">
      <span id="role-dot" class="status-dot"></span>
      <span id="role-text" class="status-role"></span>
      <span class="status-sep">・</span>
      <button type="button" id="name-display-btn" class="status-name-btn">
        <span id="name-display-value">お名前未設定</span>
      </button>
      <span id="name-edit-wrap" class="status-name-edit hidden">
        <input type="text" id="name-input" placeholder="お名前" maxlength="20" />
      </span>
      <button type="button" id="logout-btn" class="status-logout-btn" title="ログアウト" aria-label="ログアウト">ログアウト</button>
    </div>
    <a href="branch-options.html" id="branch-options-btn" class="branch-options-btn hidden">⚙ 候補管理</a>
    <button type="button" id="csv-export-btn" class="branch-options-btn hidden">⬇ CSV出力</button>
  </header>

  <nav class="page-nav">
    <a href="index.html" class="page-nav-link is-active">スケジュール</a>
    <a href="equipment.html" class="page-nav-link">備品管理</a>
  </nav>

  <main class="app-main">
    <section class="panel branch-panel">
      <label for="branch-select">支部を選択</label>
      <select id="branch-select">
        <option value="">-- 支部を選択 --</option>
      </select>
    </section>

    <section class="panel calendar-panel">
      <div class="calendar-header">
        <button type="button" id="prev-month-btn" class="btn btn-outline btn-small">＜</button>
        <span id="calendar-month-label" class="calendar-month-label"></span>
        <button type="button" id="next-month-btn" class="btn btn-outline btn-small">＞</button>
      </div>
      <div id="calendar-weekdays" class="calendar-weekdays"></div>
      <div id="calendar-grid" class="calendar-grid"></div>
    </section>

    <section class="panel schedule-panel">
      <div class="schedule-panel-header">
        <h2 id="selected-date-label" class="selected-date-label"></h2>
        <button type="button" id="new-event-toggle-btn" class="btn btn-primary btn-small">＋ この日に予定を追加</button>
      </div>

      <form id="event-form" class="event-form hidden">
        <div class="event-form-row">
          <label>
            開始時間
            <input type="time" id="event-time" required />
          </label>
          <label>
            終了時間（任意）
            <input type="time" id="event-end-time" />
          </label>
        </div>
        <label>
          場所
          <input type="text" id="event-place" list="event-place-options" placeholder="場所" required />
        </label>
        <datalist id="event-place-options"></datalist>
        <label>
          カテゴリ
          <select id="event-category-select">
            <option value="">未選択</option>
          </select>
        </label>
        <label id="event-category-other-wrap" class="hidden">
          カテゴリ名（自由入力）
          <input type="text" id="event-category-other" placeholder="カテゴリ名を入力" maxlength="50" />
        </label>
        <label>
          活動内容
          <textarea id="event-content" placeholder="活動内容" required></textarea>
        </label>
        <label>
          投稿者名
          <input type="text" id="event-poster-name" placeholder="お名前" required />
        </label>
        <p id="event-form-error" class="form-error"></p>
        <button type="submit" class="btn btn-primary">投稿する</button>
      </form>

      <div class="view-toggle" role="tablist">
        <button type="button" id="view-list-btn" class="view-toggle-btn is-active" role="tab" aria-selected="true">イベント</button>
        <button type="button" id="view-timeline-btn" class="view-toggle-btn" role="tab" aria-selected="false">タイムライン</button>
        <button type="button" id="view-mine-btn" class="view-toggle-btn" role="tab" aria-selected="false">参加予定</button>
      </div>

      <div id="event-list" class="event-list"></div>
      <div id="timeline-view" class="timeline-view hidden"></div>
      <div id="my-events-view" class="my-events-view hidden"></div>
    </section>
  </main>
</div>

<dialog id="csv-export-dialog" class="csv-export-dialog">
  <form id="csv-export-form" class="csv-export-form">
    <h2 class="csv-export-title">CSV出力</h2>

    <fieldset class="csv-export-type-group">
      <legend>出力種類</legend>
      <label class="csv-export-radio-label">
        <input type="radio" name="csv-export-type" value="events" checked />
        予定
      </label>
      <label class="csv-export-radio-label">
        <input type="radio" name="csv-export-type" value="equipment" />
        備品一覧
      </label>
      <label class="csv-export-radio-label">
        <input type="radio" name="csv-export-type" value="participants" />
        参加者リスト
      </label>
      <label class="csv-export-radio-label">
        <input type="radio" name="csv-export-type" value="history" />
        在庫チェック履歴
      </label>
    </fieldset>

    <div id="csv-export-period-wrap">
      <label>
        開始日
        <input type="date" id="csv-export-from" />
      </label>
      <label>
        終了日
        <input type="date" id="csv-export-to" />
      </label>
    </div>

    <label>
      支部
      <select id="csv-export-branch">
        <option value="">全支部</option>
      </select>
    </label>

    <p id="csv-export-error" class="form-error"></p>

    <div class="csv-export-actions">
      <button type="button" id="csv-export-cancel" class="btn btn-outline">キャンセル</button>
      <button type="submit" id="csv-export-submit" class="btn btn-primary">出力する</button>
    </div>
  </form>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
